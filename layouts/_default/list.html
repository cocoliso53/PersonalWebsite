{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="lede">{{ . }}</div>{{ end }}
    <ul class="list">
      {{ range .Pages.ByDate.Reverse }}
        <li>
          <p class="meta">{{ .Date | time.Format ":date_long" }}</p>
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          {{ with .Description }}<p>{{ . }}</p>{{ end }}
        </li>
      {{ end }}
    </ul>
  </article>
{{ end }}
